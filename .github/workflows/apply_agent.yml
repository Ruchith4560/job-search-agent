name: apply_agent
on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (~720 free minutes/month)
  workflow_dispatch:
concurrency: apply-agent       # never run two at once
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Check replies and apply
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m agent.apply.auto_apply run --submit
      - name: Save state
        run: |
          git config user.name "job-agent"; git config user.email "job-agent@users.noreply.github.com"
          git add data/tracker.db data/custom_answers.json data/output || true
          git commit -m "apply agent state" || echo "nothing to commit"
          git push
