name: apply_agent

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (~720 free minutes/month)
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: apply-agent       # never run two at once

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check replies and process auto-apply queue
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'macharuchith1@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          python -u -m agent.apply.auto_apply run --submit 2>&1 | tee apply_run.log

      - name: Save and Push State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ master_profile.json apply_run.log || true
          git commit -m "Auto-update apply agent tracker state [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || echo "Push skipped or not needed"

      - name: Upload Run Logs and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-agent-artifacts
          path: |
            apply_run.log
            data/output/
          retention-days: 14
