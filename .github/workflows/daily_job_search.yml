name: Daily AI Job Search & Application Agent

on:
  schedule:
    # 00:30 UTC corresponds to exactly 06:00 AM IST (Indian Standard Time) every morning
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web anytime
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  daily_job_run:
    name: Run Daily Job Search & Email Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Daily Job Search & Digest Pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'macharuchith1@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python -u main.py daily --non-interactive 2>&1 | tee daily_run.log

      - name: Commit and Push Tracker Database Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ master_profile.json daily_run.log || true
          git commit -m "Auto-update job tracker and application database [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || echo "Push skipped or not needed"

      - name: Upload Run Logs and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-artifacts
          path: |
            daily_run.log
            data/output/
            data/daily_digest.md
          retention-days: 14
