name: Daily AI Job Search & Application Agent

on:
  schedule:
    # 00:30 UTC corresponds to exactly 06:00 AM IST (Indian Standard Time) every morning
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web anytime

jobs:
  daily_job_run:
    name: Run Daily Job Search & Email Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Daily Job Search & Digest Pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'macharuchith1@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python main.py daily --non-interactive

      - name: Commit and Push Tracker Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update job tracker and application database [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped or not needed"
